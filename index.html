<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Apex Song Challenge</title>
<meta name="description" content="Apex English Song Challenge">

<style>
:root{
  --navy:#0b2f52;
  --navy2:#123e67;
  --gold:#d2a145;
  --paper:#f7f5f0;
  --ink:#10263d;
  --muted:#718092;
  --line:#e6e0d5;
  --good:#2f7455;
  --bad:#a64e4e;
}

*{box-sizing:border-box}

html,body{
  margin:0;
  min-height:100%;
  background:var(--paper);
  color:var(--ink);
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
}

button,input{font:inherit}
button{cursor:pointer}

.shell{
  width:min(1080px,calc(100% - 24px));
  margin:0 auto;
  padding:12px 0 32px;
}

.top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:10px;
}

.brand{
  display:flex;
  align-items:center;
  gap:9px;
}

.logo{
  width:34px;
  height:34px;
  border-radius:10px;
  background:linear-gradient(145deg,var(--navy),var(--navy2));
  position:relative;
}

.logo:after{
  content:"";
  position:absolute;
  left:10px;
  right:10px;
  top:16px;
  height:2px;
  background:var(--gold);
}

.brand strong{
  display:block;
  font-size:12px;
  letter-spacing:.12em;
  color:var(--navy);
}

.brand small{
  display:block;
  color:var(--muted);
  font-size:10px;
  margin-top:2px;
}

.stats{
  display:flex;
  gap:5px;
  flex-wrap:wrap;
  justify-content:flex-end;
}

.stat{
  min-width:60px;
  padding:5px 8px;
  border-radius:9px;
  background:#fff;
  border:1px solid var(--line);
  text-align:center;
}

.stat span{
  display:block;
  color:var(--muted);
  font-size:8px;
  text-transform:uppercase;
}

.stat strong{
  display:block;
  color:var(--navy);
  font-size:13px;
}

.game{
  background:#fff;
  border:1px solid var(--line);
  border-radius:20px;
  overflow:hidden;
  box-shadow:0 18px 55px rgba(8,35,61,.10);
}

.video-wrap{
  background:#071828;
}

.video{
  position:relative;
  width:min(820px,100%);
  margin:0 auto;
  aspect-ratio:16/9;
  background:#07131f;
}

#player{
  width:100%;
  height:100%;
}

.facade{
  position:absolute;
  inset:0;
  z-index:5;
  display:flex;
  align-items:flex-end;
  padding:22px;
  background:
    linear-gradient(0deg,rgba(5,18,31,.92),rgba(5,18,31,.05) 70%),
    url("https://i.ytimg.com/vi/YQHsXMglC9A/maxresdefault.jpg") center/cover no-repeat;
}

.facade.hidden{display:none}

.kicker{
  color:var(--gold);
  font-size:10px;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.12em;
}

.facade h1{
  margin:5px 0 5px;
  color:#fff;
  font-size:38px;
}

.facade p{
  margin:0 0 13px;
  color:rgba(255,255,255,.78);
  font-size:12px;
}

.btn{
  border:0;
  border-radius:9px;
  min-height:36px;
  padding:0 12px;
  font-weight:800;
}

.btn-primary{
  background:var(--gold);
  color:#17130e;
}

.btn-secondary{
  background:#edf3f7;
  color:var(--navy);
  border:1px solid #dae3ea;
}

.btn-ghost{
  background:#fff;
  color:var(--navy);
  border:1px solid var(--line);
}

.player-controls{
  width:min(820px,100%);
  margin:0 auto;
  display:flex;
  align-items:center;
  gap:8px;
  padding:7px 10px;
  background:var(--navy);
}

.player-controls button{
  background:rgba(255,255,255,.08);
  color:#fff;
  border:1px solid rgba(255,255,255,.12);
  min-height:32px;
}

#progress{
  flex:1;
  min-width:80px;
}

#time{
  color:rgba(255,255,255,.75);
  font-size:11px;
  min-width:45px;
  text-align:right;
}

.lesson{
  width:min(820px,100%);
  margin:0 auto;
  padding:12px 16px 14px;
}

.lesson-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:6px;
}

#state{
  font-size:10px;
  font-weight:900;
  text-transform:uppercase;
  letter-spacing:.1em;
  color:var(--navy);
}

.lesson-note{
  font-size:10px;
  color:var(--muted);
}

.lyric-window{
  min-height:90px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
}

#currentLine{
  width:100%;
  color:var(--navy);
  font-size:clamp(23px,3vw,33px);
  font-weight:850;
  line-height:1.25;
}

#prevLine,#nextLine{
  display:none;
}

.inline-input{
  display:inline-block;
  min-width:130px;
  max-width:220px;
  height:38px;
  margin:0 4px;
  padding:0 8px;
  border:0;
  border-bottom:2px solid var(--gold);
  border-radius:7px 7px 0 0;
  background:#fbf7ed;
  color:var(--navy);
  text-align:center;
  font-weight:900;
  outline:none;
}

.actions{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:7px;
  margin-top:7px;
}

.feedback{
  min-height:18px;
  text-align:center;
  margin-top:6px;
  font-size:11px;
  font-weight:700;
}

.feedback.good{color:var(--good)}
.feedback.bad{color:var(--bad)}

.pause-overlay{
  position:absolute;
  inset:0;
  z-index:7;
  display:none;
  align-items:center;
  justify-content:center;
  background:rgba(5,18,31,.45);
}

.pause-overlay.show{display:flex}

.pause-card{
  background:#fff;
  border-radius:13px;
  padding:14px;
  text-align:center;
}

.pause-card strong{
  display:block;
  color:var(--navy);
  margin-bottom:8px;
}

.footer-note{
  text-align:center;
  padding:7px 12px 9px;
  border-top:1px solid #eee9df;
  color:#8b949d;
  font-size:9px;
}

@media(max-width:760px){
  .shell{
    width:calc(100% - 10px);
    padding-top:6px;
  }

  .top{
    align-items:flex-start;
  }

  .stats{
    gap:3px;
  }

  .stat{
    min-width:50px;
    padding:4px;
  }

  .video,
  .player-controls,
  .lesson{
    width:100%;
  }

  #currentLine{
    font-size:25px;
  }

  .lyric-window{
    min-height:105px;
  }
}
</style>
</head>

<body>

<main class="shell">

  <header class="top">
    <div class="brand">
      <div class="logo"></div>
      <div>
        <strong>APEX ENGLISH</strong>
        <small>Song Challenge</small>
      </div>
    </div>

    <div class="stats">
      <div class="stat"><span>Score</span><strong id="score">0</strong></div>
      <div class="stat"><span>Gaps</span><strong id="gaps">0/24</strong></div>
      <div class="stat"><span>Hits</span><strong id="hits">0</strong></div>
      <div class="stat"><span>Fails</span><strong id="fails">0</strong></div>
      <div class="stat"><span>Bonus</span><strong id="bonus">x1</strong></div>
    </div>
  </header>

  <section class="game">

    <div class="video-wrap">

      <div class="video">

        <div id="player"></div>

        <div class="pause-overlay" id="pauseOverlay">
          <div class="pause-card">
            <strong>Challenge paused</strong>
            <button class="btn btn-primary" id="resumeBtn">Resume</button>
          </div>
        </div>

        <div class="facade" id="facade">
          <div>
            <div class="kicker">B1 Listening Challenge</div>
            <h1>Hello</h1>
            <p>Listen to the line, complete the missing word and continue.</p>
            <button class="btn btn-primary" id="startBtn">
              Start Challenge
            </button>
          </div>
        </div>

      </div>

      <div class="player-controls">
        <button class="btn" id="pauseBtn" disabled>Pause</button>
        <button class="btn" id="restartBtn" disabled>Restart</button>

        <input
          id="progress"
          type="range"
          min="0"
          max="367"
          step="0.1"
          value="0"
          disabled
        >

        <span id="time">0:00</span>
      </div>

    </div>

    <div class="lesson">

      <div class="lesson-head">
        <div id="state">Ready</div>
        <div class="lesson-note">Listen → answer → continue</div>
      </div>

      <div class="lyric-window">
        <div id="prevLine"></div>
        <div id="currentLine">Press Start Challenge to begin.</div>
        <div id="nextLine"></div>
      </div>

      <div class="actions">
        <button class="btn btn-primary" id="checkBtn" disabled>Check</button>
        <button class="btn btn-secondary" id="replayBtn" disabled>Listen Again</button>
        <button class="btn btn-ghost" id="hintBtn" disabled>Hint</button>
        <button class="btn btn-ghost" id="skipBtn" disabled>Skip</button>
      </div>

      <div id="feedback" class="feedback"></div>

    </div>

    <div class="footer-note">
      Full line first · Stops at line end · 24 listening gaps
    </div>

  </section>

</main>

<script>
const CONFIG = {
  videoId: "YQHsXMglC9A",
  approxDuration: 367,

  cues: [
    {
      replayFrom:83,
      lineEndsAt:91,
      before:"I was",
      answer:"wondering",
      after:"if after all these years you'd like to meet"
    },
    {
      replayFrom:90,
      lineEndsAt:96.5,
      before:"To go over",
      answer:"everything",
      after:""
    },
    {
      replayFrom:95,
      lineEndsAt:101.5,
      before:"They say that time's",
      answer:"supposed",
      after:"to heal you"
    },
    {
      replayFrom:100,
      lineEndsAt:105,
      before:"But I ain't done much",
      answer:"healing",
      after:""
    },
    {
      replayFrom:104,
      lineEndsAt:110,
      before:"Hello, can you",
      answer:"hear",
      after:"me?"
    },
    {
      replayFrom:109,
      lineEndsAt:116.5,
      before:"I'm in California",
      answer:"dreaming",
      after:"about who we used to be"
    },
    {
      replayFrom:115,
      lineEndsAt:121.5,
      before:"When we were",
      answer:"younger",
      after:"and free"
    },
    {
      replayFrom:120,
      lineEndsAt:128.5,
      before:"I've",
      answer:"forgotten",
      after:"how it felt before the world fell at our feet"
    },
    {
      replayFrom:127,
      lineEndsAt:133.5,
      before:"There's such a",
      answer:"difference",
      after:"between us"
    },
    {
      replayFrom:132,
      lineEndsAt:138.5,
      before:"And a",
      answer:"million",
      after:"miles"
    },
    {
      replayFrom:140,
      lineEndsAt:147,
      before:"Hello from the",
      answer:"other",
      after:"side"
    },
    {
      replayFrom:146,
      lineEndsAt:153.5,
      before:"I must've called a",
      answer:"thousand",
      after:"times"
    },
    {
      replayFrom:152,
      lineEndsAt:160,
      before:"To tell you I'm",
      answer:"sorry",
      after:"for everything that I've done"
    },
    {
      replayFrom:158,
      lineEndsAt:165.5,
      before:"But when I call you",
      answer:"never",
      after:"seem to be home"
    },
    {
      replayFrom:165,
      lineEndsAt:172.5,
      before:"Hello from the",
      answer:"outside",
      after:""
    },
    {
      replayFrom:171,
      lineEndsAt:178.5,
      before:"At least I can say that I've",
      answer:"tried",
      after:""
    },
    {
      replayFrom:179,
      lineEndsAt:186.5,
      before:"To tell you I'm sorry for",
      answer:"breaking",
      after:"your heart"
    },
    {
      replayFrom:186,
      lineEndsAt:194.5,
      before:"It",
      answer:"clearly",
      after:"doesn't tear you apart anymore"
    },
    {
      replayFrom:201,
      lineEndsAt:208.5,
      before:"It's so",
      answer:"typical",
      after:"of me to talk about myself"
    },
    {
      replayFrom:219,
      lineEndsAt:228,
      before:"It's no",
      answer:"secret",
      after:"that the both of us are running out of time"
    },
    {
      replayFrom:270,
      lineEndsAt:276.5,
      before:"To tell you I'm sorry for breaking your",
      answer:"heart",
      after:""
    },
    {
      replayFrom:275,
      lineEndsAt:283.5,
      before:"It clearly doesn't tear you",
      answer:"apart",
      after:"anymore"
    },
    {
      replayFrom:310,
      lineEndsAt:318.5,
      before:"I must've called a thousand",
      answer:"times",
      after:""
    },
    {
      replayFrom:315,
      lineEndsAt:325.5,
      before:"To tell you I'm sorry for everything that I've",
      answer:"done",
      after:""
    }
  ]
};

let player;
let loop;

let cueIndex = 0;
let cueOpen = false;

let solved = 0;
let hits = 0;
let fails = 0;
let hints = 0;
let score = 0;
let bonus = 1;

const $ = id => document.getElementById(id);

const startBtn = $("startBtn");
const facade = $("facade");

const pauseBtn = $("pauseBtn");
const restartBtn = $("restartBtn");

const progress = $("progress");
const time = $("time");

const state = $("state");
const currentLine = $("currentLine");

const checkBtn = $("checkBtn");
const replayBtn = $("replayBtn");
const hintBtn = $("hintBtn");
const skipBtn = $("skipBtn");

const feedback = $("feedback");

const pauseOverlay = $("pauseOverlay");
const resumeBtn = $("resumeBtn");

function formatTime(sec){
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60).toString().padStart(2,"0");
  return `${m}:${s}`;
}

function updateStats(){
  $("score").textContent = score;
  $("gaps").textContent = `${solved}/${CONFIG.cues.length}`;
  $("hits").textContent = hits;
  $("fails").textContent = fails;
  $("bonus").textContent = `x${bonus}`;
}

function setTools(active){
  checkBtn.disabled = !active;
  replayBtn.disabled = !active;
  hintBtn.disabled = !active;
  skipBtn.disabled = !active;
}

function showListening(){
  currentLine.textContent =
    "Listen carefully — the gap appears when the line ends.";

  feedback.textContent = "";
}

function loadYouTube(){

  if(window.YT && YT.Player){
    createPlayer();
    return;
  }

  const script = document.createElement("script");
  script.src = "https://www.youtube.com/iframe_api";
  document.head.appendChild(script);

  state.textContent = "Loading";
}

window.onYouTubeIframeAPIReady = createPlayer;

function createPlayer(){

  if(player) return;

  player = new YT.Player("player",{

    videoId:CONFIG.videoId,

    playerVars:{
      playsinline:1,
      controls:0,
      disablekb:1,
      rel:0,
      cc_load_policy:0,
      fs:0,
      iv_load_policy:3
    },

    events:{

      onReady:event=>{

        facade.classList.add("hidden");

        pauseBtn.disabled = false;
        restartBtn.disabled = false;
        progress.disabled = false;

        state.textContent = "Playing";

        showListening();

        try{
          event.target.unloadModule("captions");
          event.target.unloadModule("cc");
        }catch(e){}

        event.target.playVideo();

        startLoop();
      },

      onError:event=>{
        state.textContent = `YouTube error ${event.data}`;
      }
    }
  });
}

function startLoop(){

  clearInterval(loop);

  loop = setInterval(()=>{

    if(!player || !player.getCurrentTime) return;

    const t = player.getCurrentTime();

    time.textContent = formatTime(t);

    progress.value = t;

    if(cueOpen){

      try{
        player.pauseVideo();
      }catch(e){}

      return;
    }

    if(cueIndex >= CONFIG.cues.length){

      state.textContent = "Challenge complete";

      return;
    }

    const cue = CONFIG.cues[cueIndex];

    if(t >= cue.lineEndsAt){

      openCue();
    }

  },80);
}

function openCue(){

  const cue = CONFIG.cues[cueIndex];

  cueOpen = true;

  player.seekTo(cue.lineEndsAt,true);
  player.pauseVideo();

  setTimeout(()=>{
    try{
      player.seekTo(cue.lineEndsAt,true);
      player.pauseVideo();
    }catch(e){}
  },100);

  state.textContent =
    `Gap ${cueIndex + 1} of ${CONFIG.cues.length}`;

  currentLine.innerHTML =
    `${escapeHtml(cue.before)} ` +
    `<input
      id="gapInput"
      class="inline-input"
      autocomplete="off"
      spellcheck="false"
      aria-label="Missing word"
    >` +
    ` ${escapeHtml(cue.after)}`;

  setTools(true);

  checkBtn.textContent = "Check";
  checkBtn.dataset.mode = "check";

  const input = $("gapInput");

  input.focus();

  input.addEventListener("keydown",e=>{

    if(e.key === "Enter"){

      e.preventDefault();

      checkAnswer();
    }
  });

  feedback.textContent = "";
}

function normalize(value){
  return value
    .trim()
    .toLowerCase()
    .replace(/\s+/g," ");
}

function checkAnswer(){

  if(!cueOpen) return;

  if(checkBtn.dataset.mode === "continue"){

    cueIndex++;
    cueOpen = false;
    hints = 0;

    checkBtn.textContent = "Check";
    checkBtn.dataset.mode = "check";

    setTools(false);

    state.textContent = "Playing";

    showListening();

    player.playVideo();

    return;
  }

  const cue = CONFIG.cues[cueIndex];

  const input = $("gapInput");

  if(!input) return;

  const value = normalize(input.value);

  if(!value){

    feedback.className = "feedback bad";
    feedback.textContent = "Type the missing word.";

    return;
  }

  if(value === normalize(cue.answer)){

    hits++;
    solved++;

    const points =
      hints === 0
        ? 100
        : Math.max(40,100 - hints * 25);

    score += Math.round(points * bonus);

    bonus = Math.min(4,bonus + 1);

    currentLine.innerHTML =
      `${escapeHtml(cue.before)} ` +
      `<strong>${escapeHtml(cue.answer)}</strong>` +
      ` ${escapeHtml(cue.after)}`;

    replayBtn.disabled = true;
    hintBtn.disabled = true;
    skipBtn.disabled = true;

    checkBtn.disabled = false;
    checkBtn.textContent = "Continue";
    checkBtn.dataset.mode = "continue";

    feedback.className = "feedback good";
    feedback.textContent = "Correct.";

    state.textContent = "Correct — press Continue";

    updateStats();

  }else{

    fails++;
    bonus = 1;

    updateStats();

    feedback.className = "feedback bad";
    feedback.textContent = "Try again.";

    input.select();
  }
}

function replayCue(){

  if(cueIndex >= CONFIG.cues.length) return;

  const cue = CONFIG.cues[cueIndex];

  cueOpen = false;

  setTools(false);

  state.textContent = "Listening again";

  showListening();

  player.seekTo(cue.replayFrom,true);
  player.playVideo();
}

function giveHint(){

  if(cueIndex >= CONFIG.cues.length) return;

  const cue = CONFIG.cues[cueIndex];

  hints++;
  bonus = 1;

  updateStats();

  if(hints === 1){

    feedback.className = "feedback";
    feedback.textContent =
      `${cue.answer.length} letters`;

  }else{

    feedback.className = "feedback";
    feedback.textContent =
      `Starts with ${cue.answer[0].toUpperCase()}`;
  }
}

function skipCue(){

  if(cueIndex >= CONFIG.cues.length) return;

  const cue = CONFIG.cues[cueIndex];

  currentLine.innerHTML =
    `${escapeHtml(cue.before)} ` +
    `<strong>${escapeHtml(cue.answer)}</strong>` +
    ` ${escapeHtml(cue.after)}`;

  bonus = 1;

  updateStats();

  setTools(false);

  setTimeout(()=>{

    cueIndex++;
    cueOpen = false;
    hints = 0;

    showListening();

    state.textContent = "Playing";

    player.playVideo();

  },500);
}

function pauseGame(){

  if(!player) return;

  if(player.getPlayerState() === 1){

    player.pauseVideo();

    pauseOverlay.classList.add("show");

  }else if(!cueOpen){

    player.playVideo();
  }
}

function resumeGame(){

  pauseOverlay.classList.remove("show");

  if(!cueOpen){

    player.playVideo();
  }
}

function restartGame(){

  cueIndex = 0;
  cueOpen = false;

  solved = 0;
  hits = 0;
  fails = 0;
  hints = 0;
  score = 0;
  bonus = 1;

  updateStats();

  setTools(false);

  pauseOverlay.classList.remove("show");

  showListening();

  state.textContent = "Playing";

  player.seekTo(0,true);
  player.playVideo();
}

function escapeHtml(value){

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;");
}

startBtn.addEventListener("click",loadYouTube);

checkBtn.addEventListener("click",checkAnswer);

replayBtn.addEventListener("click",replayCue);

hintBtn.addEventListener("click",giveHint);

skipBtn.addEventListener("click",skipCue);

pauseBtn.addEventListener("click",pauseGame);

resumeBtn.addEventListener("click",resumeGame);

restartBtn.addEventListener("click",restartGame);

progress.addEventListener("input",()=>{

  if(player && !cueOpen){

    player.seekTo(Number(progress.value),true);
  }
});

updateStats();
</script>

</body>
</html>
